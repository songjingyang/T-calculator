version: 2.1

orbs:
  aws-ecr: circleci/aws-ecr@9.4.0
  aws-cli: circleci/aws-cli@5.1.1

workflows:
  build-and-push:
    jobs:
      - aws-ecr/build_and_push_image:
          account_id: "123456789012"
          auth:
            - aws-cli/setup:
                role_arn: arn:aws:iam::123456789012:role/VALID_OIDC_ECR_ROLE
          repo: "myECRRepository"
          tag: "latest"
          region: "us-west-2"
          create_repo: true
